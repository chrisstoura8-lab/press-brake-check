<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Press Brake Tooling Check</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* layout idea: a setup sheet for the press brake. Part and tooling on top, verdict, then the cross-section of each bend step; the tool library is its own view. */
:root{
  --paper:#eef0ef; --card:#fafbfa; --ink:#182024; --mute:#5c686e; --line:#cdd3d4; --field:#ffffff; --metal:#dfe4e5; --tool:#8b979c;
  --accent:#1f5fa8; --accent-ink:#ffffff; --bad:#c22d1e; --bad-bg:#fbe6e2; --ok:#1f6f4a; --ok-bg:#e0f1e8;
  --display:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#14191b; --card:#1c2326; --ink:#e6ebec; --mute:#96a3a8; --line:#333d41; --field:#12171a; --metal:#2b3539; --tool:#5d6a70;
    --accent:#6ea3db; --accent-ink:#10161a; --bad:#ff7a66; --bad-bg:#3d1c17; --ok:#5fc497; --ok-bg:#16301f;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#14191b; --card:#1c2326; --ink:#e6ebec; --mute:#96a3a8; --line:#333d41; --field:#12171a; --metal:#2b3539; --tool:#5d6a70;
  --accent:#6ea3db; --accent-ink:#10161a; --bad:#ff7a66; --bad-bg:#3d1c17; --ok:#5fc497; --ok-bg:#16301f;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:400 15px/1.45 var(--body);-webkit-text-size-adjust:100%}
.wrap{max-width:920px;margin:0 auto;padding:20px 16px 48px;display:flex;flex-direction:column;gap:18px}
h1,h2{font-family:var(--display);margin:0;text-wrap:balance}
h1{font-size:28px;line-height:1.1;font-weight:700}
h2{font-size:17px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
p{margin:0}
.mute{color:var(--mute)} .num{font-family:var(--mono);font-variant-numeric:tabular-nums}
header.top{display:flex;gap:12px 20px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:14px}
header.top p{max-width:60ch;margin-top:6px}
.langs{display:flex;border:1px solid var(--ink);border-radius:4px;overflow:hidden}
.langs button{border:0;background:transparent;color:var(--ink);font:600 13px var(--mono);padding:7px 11px;cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--ink);background:var(--card);border-radius:4px;padding:9px 14px;font-weight:500;cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.drop{border:1.5px dashed var(--mute);border-radius:6px;padding:12px;display:flex;flex-direction:row;gap:10px;align-items:center;flex-wrap:wrap}
.drop.over{border-color:var(--accent);background:var(--card)}
.drop input[type=file]{position:absolute;width:1px;height:1px;opacity:0}
.drop p{flex:1 1 160px;font-size:13px}
.msg{background:var(--bad-bg);color:var(--bad);border-left:4px solid var(--bad);padding:9px 12px;border-radius:3px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:5px 12px;font-size:13px;cursor:pointer;max-width:100%;overflow-wrap:anywhere}
.tabs button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.inputs{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mute);min-width:0}
input[type=number],select{background:var(--field);border:1px solid var(--line);border-radius:4px;padding:7px 8px;width:100%;min-width:0;font-family:var(--mono);font-size:14px;color:var(--ink)}
.verdict{border-radius:6px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border:1px solid;border-left-width:6px}
.verdict.bad{background:var(--bad-bg);color:var(--bad);border-color:var(--bad)}
.verdict.ok{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
.verdict b{font:700 22px var(--display);letter-spacing:.01em}
.verdict span{font-size:13px;color:var(--ink)}
.draw{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:10px}
.draw svg{display:block;width:100%;height:auto;max-height:70vh;overflow:hidden}
.mk{cursor:pointer}
.issues{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.issues li{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:4px;padding:8px 10px;cursor:pointer}
.issues li.sel{outline:2px solid var(--bad)}
.issues .no{flex:none;width:22px;height:22px;border-radius:50%;background:var(--bad);color:#fff;font:600 12px/22px var(--mono);text-align:center}
.issues small{display:block;color:var(--mute)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:7px 6px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:500;color:var(--mute);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.tw{overflow-x:auto}
.pill{display:inline-block;font:600 12px var(--mono);border-radius:99px;padding:2px 9px;border:1px solid;white-space:nowrap}
.pill.ok{color:var(--ok);background:var(--ok-bg)} .pill.bad{color:var(--bad);background:var(--bad-bg)} .pill.na{color:var(--mute)}
details{border:1px solid var(--line);border-radius:6px;background:var(--card)}
details>summary{cursor:pointer;padding:10px 14px;font-weight:500}
.din{padding:4px 14px 14px;display:flex;flex-direction:column;gap:14px}
.din ul{margin:0;padding-left:20px;max-width:70ch;font-size:13px;display:flex;flex-direction:column;gap:5px}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.views{display:flex;border-bottom:1px solid var(--line);gap:4px}
.views button{border:0;background:transparent;padding:9px 14px;font-weight:600;color:var(--mute);border-bottom:3px solid transparent;cursor:pointer}
.views button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.steps button{border:1px solid var(--line);background:var(--card);border-radius:4px;padding:6px 10px;font:500 13px var(--mono);cursor:pointer}
.steps button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.steps button.bad{border-color:var(--bad);color:var(--bad)}
.steps button.bad[aria-pressed="true"]{background:var(--bad);color:#fff}
input[type=range]{width:100%;accent-color:var(--accent)}
input[type=text]{background:var(--field);border:1px solid var(--line);border-radius:4px;padding:7px 8px;width:100%;min-width:0;font-size:14px;color:var(--ink)}
td input[type=number]{width:78px;padding:5px 6px} td select{width:auto;max-width:100%;padding:5px 6px}
.tool{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:10px}
.thead{display:flex;gap:12px;align-items:center}
.tthumb{flex:0 0 64px;height:64px;border:1px solid var(--line);border-radius:4px;background:var(--field);padding:4px}
.tthumb svg{width:100%;height:100%}
.btn.sm{padding:5px 10px;font-size:13px}
.btn[disabled]{opacity:.35;cursor:default}
.hid{position:absolute;width:1px;height:1px;opacity:0}
.vlist{display:flex;flex-direction:column;gap:6px}
.vrow{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;font-size:13px}
.vrow label{flex:0 1 110px}
.vrow .chk{flex:none;padding-bottom:6px}
.fits{display:flex;gap:6px 14px;flex-wrap:wrap;align-items:center;font-size:13px}
.chk{flex-direction:row;align-items:center;gap:6px;font-size:13px;color:var(--ink)}
.chk input{width:18px;height:18px;accent-color:var(--accent)}
.tag{font:500 11px var(--mono);text-transform:uppercase;letter-spacing:.05em;border:1px solid var(--mute);color:var(--mute);border-radius:99px;padding:1px 8px}
.issues li{cursor:default}
.issues.notes li{border-left-color:var(--accent)}
section{display:flex;flex-direction:column;gap:10px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
window.PB_LIBRARY = null; /* replaced by the shop's exported tool library: { v: 'date', tools: [...] } */
(function (G) {
  'use strict';
  var TOL = 0.05;

  /* ---------- DXF reading ---------- */
  function parsePairs(text) {
    var L = text.split(/\r\n|\r|\n/), P = [];
    for (var i = 0; i + 1 < L.length; i += 2) {
      var c = parseInt(L[i], 10);
      if (!isNaN(c)) P.push([c, L[i + 1].trim()]);
    }
    return P;
  }
  var UNIT = { 1: 25.4, 2: 304.8, 4: 1, 5: 10, 6: 1000 };

  function readDXF(text) {
    if (/^AutoCAD Binary DXF/.test(text)) throw new Error('binary');
    var P = parsePairs(text), scale = 1, s = -1, i;
    for (i = 0; i < P.length - 1; i++) {
      if (P[i][0] === 9 && P[i][1] === '$INSUNITS') { scale = UNIT[parseInt(P[i + 1][1], 10)] || 1; }
      if (P[i][0] === 0 && P[i][1] === 'SECTION' && P[i + 1][0] === 2 && P[i + 1][1] === 'ENTITIES') { s = i + 2; break; }
    }
    if (s < 0) throw new Error('noentities');
    var ents = [], cur = null;
    for (i = s; i < P.length; i++) {
      if (P[i][0] === 0) { if (P[i][1] === 'ENDSEC') break; cur = { type: P[i][1], p: [] }; ents.push(cur); }
      else if (cur) cur.p.push(P[i]);

    return toPieces(ents, scale);

  function val(e, code, def) {
    for (var i = 0; i < e.p.length; i++) if (e.p[i][0] === code) return parseFloat(e.p[i][1]);
    return def;
  }
  function str(e, code, def) {
    for (var i = 0; i < e.p.length; i++) if (e.p[i][0] === code) return e.p[i][1];
    return def;
  }
  function dist(a, b) { return Math.hypot(a[0] - b[0], a[1] - b[1]); }
  function polyLen(pts) { var s = 0; for (var i = 1; i < pts.length; i++) s += dist(pts[i - 1], pts[i]); return s; }

  function arcPts(cx, cy, r, a0, sweep) {
    var as = Math.abs(sweep);

    n = Math.min(n, 2000);

    for (var k = 0; k <= n; k++) { var a = a0 + sweep * k / n; pts.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]); }

  function bulgeSeg(p1, p2, b) {
    var th = 4 * Math.atan(b), d = dist(p1, p2);
    if (d < 1e-9) return { pts: [p2], len: 0 };
    var r = d / (2 * Math.sin(Math.abs(th) / 2));
    var k = (1 - b * b) / (4 * b);
    var cx = (p1[0] + p2[0]) / 2 - (p2[1] - p1[1]) * k, cy = (p1[1] + p2[1]) / 2 + (p2[0] - p1[0]) * k;
    var a0 = Math.atan2(p1[1] - cy, p1[0] - cx);
    var pts = arcPts(cx, cy, r, a0, th); pts.shift();
    pts[pts.length - 1] = p2;
    return { pts: pts, len: r * Math.abs(th) };
  }

  function polyPiece(verts, closed) {
    var pts = [[verts[0].x, verts[0].y]], len = 0, n = verts.length, m = closed ? n : n - 1;
    for (var i = 0; i < m; i++) {
      var a = verts[i], b = verts[(i + 1) % n], p1 = [a.x, a.y], p2 = [b.x, b.y];
      if (a.b) { var s = bulgeSeg(p1, p2, a.b); len += s.len; pts = pts.concat(s.pts); }
      else { len += dist(p1, p2); pts.push(p2); }

  }

  function splinePts(deg, knots, cps, ws) {
    var n = cps.length - 1, N = Math.max(60, cps.length * 24), out = [];
    var t0 = knots[deg], t1 = knots[n + 1];

  }

  function toPieces(ents, scale) {
    var out = [], skipped = {}, i, j, e;
    function push(pc, e, mirror) {
      if (!pc || pc.pts.length < 2) return;
      var pts = pc.pts.map(function (p) { return [(mirror ? -p[0] : p[0]) * scale, p[1] * scale]; });

    var s = layer.toLowerCase();

    for (var i = 0, j = poly.length - 1; i < poly.length; j = i++) {

    }

  }

    var p = pts.slice().sort(function (a, b) { return a[0] - b[0] || a[1] - b[1]; });
    if (p.length < 3) return p;

    if (!ev) { var dd = dieOpts().filter(function (x) { return x.val === selD; })[0]; el.innerHTML = dd && !(dd.v.V > 0) ? '<p class="msg">' + t('noV') + '</p>' : ''; return; }
    var n = ev.issues.length, G = ev.groups[part.gi], sq = G.seq;
    if (!userStep) { si = 0; prog = 1; for (var fi = 0; fi < sq.steps.length; fi++) if (!sq.steps[fi].ok) { si = fi; prog = sq.steps[fi].prog == null ? 1 : sq.steps[fi].prog; break; } }
    var sd = (part.sides && part.sides[part.gi]) || {};
    var st = sq.steps[si], why = st && !st.ok ? ev.issues.filter(function (x) { return (x.g || 0) === part.gi && x.bend === st.k && /^(col|g[NLH])/.test(x.id); })[0] : null;
    var h = '<div class="verdict ' + (ev.ok ? 'ok' : 'bad') + '"><b>' + (ev.ok ? '✓ ' + t('ok') : '✕ ' + t('bad')) + '</b><span>' + (ev.ok ? '' : (n === 1 ? t('nProb1') : t('nProb', { n: n })) + ' · ') + esc(ev.pu.name) + ' + ' + esc(ev.di.name) + '</span></div>';
    if (ev.order) h += '<p class="mute" style="font-size:13px">' + t('order', { x: 'ABCDEF'.charAt(ev.order[0]), y: 'ABCDEF'.charAt(ev.order[1]) }) + '</p>';
    h += '<section><h2>' + t('seq') + (ev.groups.length > 1 ? ' ' + 'ABCDEF'.charAt(part.gi) : '') + '</h2><div class="steps">' + sq.steps.map(function (s, i) { return '<button type="button" data-step="' + i + '" class="' + (s.ok ? '' : 'bad') + '" aria-pressed="' + (i === si) + '">' + (i + 1) + ' · ' + t('bendN', { n: lab(part.gi, s.k) }) + (s.mirror ? ' ↔' : '') + (s.ok ? '' : ' ✕') + '</button>'; }).join('') + '</div>' +
      (sq.manual ? '<div class="tw"><table>' + sq.steps.map(function (s, i) { return '<tr><td class="num">' + (i + 1) + '</td><td>' + t('bendN', { n: lab(part.gi, s.k) }) + (s.ok ? '' : ' ✕') + '</td><td><select id="gs-' + i + '" aria-label="' + t('gSel') + '" data-gs="' + s.k + '">' + opt('', t('gAuto'), sd[s.k] || '') + opt('b', t('gOn', { n: s.k + 1, l: nf(G.S.legs[s.k], 0) }), sd[s.k] || '') + opt('a', t('gOn', { n: s.k + 2, l: nf(G.S.legs[s.k + 1], 0) }), sd[s.k] || '') + '</select></td><td class="n"><button class="btn sm" type="button" data-mv=""' + i + '" data-by="-1"' + (i ? '' : ' disabled') + ' aria-label="' + t('earlier') + '">↑</button> <button class="btn sm" type="button" data-mv="' + i + '" data-by="1"' + (i < sq.steps.length - 1 ? '' : ' disabled') + ' aria-label="' + t('later') + '">↓</button></td></tr>'; }).join('') + '</table></div>' : '') +
      (sq.steps.length > 1 ? '<div class="actions"><button class="btn sm" type="button" data-act="' + (sq.manual ? 'seqAuto' : 'seqSet') + '">' + t(sq.manual ? 'autoSeq' : 'setSeq') + '</button></div>' : '') +
      '<p class="mute" style="font-size:12px">' + (sq.manual ? t('seqMan') : sq.best ? t('seqBest', { n: sq.nFeasible }) : sq.greedy ? t('seqGreedy') : sq.ok && sq.searched ? t('seqAuto') : !sq.ok && sq.searched ? t('seqNone') : !sq.searched ? t('seqList') : '') + (sq.steps.some(function (s) { return s.mirror; }) ? ' · ↔ = ' + t('turned') : '') + (st && st.G > 0 ? ' · ' + t('gaugeAt', { g: nf(st.G, 1) }) : '') + (sq.score ? '<br>' + t('hand', { a: sq.score.turns, b: sq.score.flips, g: nf(sq.score.gmax, 0) }) : '') + '</p>' + altHtml(sq) + (why ? '<p class="msg">' + esc(issueText(why)) + (st.other ? ' ' + t('gSide') : '') + '</p>' : '') + (!sq.ok ? '<p class="mute" style="font-size:13px;max-width:70ch">' + t('dirHint') + '</p>' : '') + '</section>';
    h += '<div class="draw" id="sim"></div><div class="actions"><button class="btn sm" type="button" data-act="zoom">' + t(fit ? 'zoomT' : 'zoomP') + '</button></div><label for="i-prog">' + t('prog') + '<input id="i-prog" type="range" min="0" max="100" step="1" value="' + Math.round(prog * 100) + '" data-prog="1"></label>';
    h += '<p class="mute num" style="font-size:13px">' + t('info', { u: UN(), r: nf(ev.r, 1), f: nf(fromKN(ev.loadPerM), cfg.unitK ? 0 : 1), bd: nf(P.bendDeduction(Math.PI / 2, part.t, ev.r, ev.K), 2) }) + ' · ' + t('force', { u: UN(), f: nf(fromT(ev.fmax), cfg.unitK ? 0 : 1) }) + '</p>';
    if (n) h += '<section><h2>' + t('found') + '</h2><ol class="issues">' + ev.issues.map(function (x, i) { return '<li><span class="no">' + (i + 1) + '</span><span>' + esc(issueText(x)) + '</span></li>'; }).join('') + '</ol></section>';
    if (ev.notes.length) h += '<section><h2>' + t('notes') + '</h2><ol class="issues notes">' + ev.notes.map(function (x) { return '<li><span>' + esc(issueText(x)) + '</span></li>'; }).join('') + '</ol></section>';
    h += '<section><h2>' + t('sugT') + '</h2><div class="actions"><button class="btn" type="button" data-act="suggest">' + t('suggest') + '</button></div><div id="sugg">' + suggHtml() + '</div></section>';
    h += '<details id="dBox"' + (open.dBox ? ' open' : '') + '><summary>' + t('boxT') + '</summary><div class="din"><label class="chk" for="c-gShort"><input type="checkbox" id="c-gShort" data-cfgb="gShort"' + (cfg.gShort ? ' checked' : '') + '>' + t('cGShort') + '</label>' + unitSel('u-chk') + '<div class="inputs">' + [['boxCl', 'cCl'], ['boxTol', 'cTol'], ['maxHits', 'cHits']].map(function (c) { return '<label for="c-' + c[0] + '">' + t(c[1]) + '<input id="c-' + c[0] + '" type="number" inputmode="decimal" min="0" step="any" data-cfg="' + c[0] + '" value="' + cfg[c[0]] + '"></label>'; }).join('') + '</div></div></details>';
    el.innerHTML = h; document.getElementById('sim').innerHTML = simSvg();
  }

  function saveFile(name, data, mime) {
    var blob = new Blob([data], { type: mime });
    var direct = function () { try { var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); } catch (e) { } };
    if (window.claude && window.claude.use) window.claude.use('downloads').then(function (d) { if (d) return d.save({ filename: name, data: blob }).catch(function () { }); direct(); }, direct);
    else direct();
  }
  function readAll(files, each, done) {
    var list = [].slice.call(files), left = list.length; if (!left) return;
    list.forEach(function (f) { var r = new FileReader(); r.onload = function () { each(f.name, String(r.result)); if (--left === 0) done(); }; r.onerror = function () { msgs.push(f.name + ': ' + t('errRead')); if (--left === 0) done(); }; r.readAsText(f); });
  }
  function addTool(kind, name, text) {
    var pts;
    try { pts = P.profileFromDXF(text); } catch (e) { msgs.push(name + ': ' + t(e.message === 'noprofile' ? 'errProf' : 'errRead')); return; }
    var id = kind[0] + '-' + Date.now().toString(36) + Math.floor(Math.random() * 1e4), nm = name.replace(/\.dxf$/i, '');
    if (kind === 'punch') { var n = P.normPunch(pts); lib.push({ id: id, name: nm, kind: 'punch', pts: n.pts, angle: 88, radius: 0.8, maxLoad: 1000, length: 0, fits: tools('machine').map(function (m) { return m.id; }) }); selP = id; }
    else { var d = P.normDie(pts); lib.push({ id: id, name: nm, kind: 'die', pts: d.pts, V: d.V, angle: 88, maxLoad: 1000, length: 0, tMin: 0, tMax: 0, fits: tools('machine').map(function (m) { return m.id; }) }); selD = id; }
    fixSel();
  }
  function fixSel() {
    if (selM && !byId(selM)) selM = '';
    var ap = avail('punch');
    if (!ap.some(function (x) { return x.id === selP; })) selP = (ap[0] || {}).id;
    var od = dieOpts(); if (!od.some(function (x) { return x.val === selD; })) selD = ((od.filter(function (x) { return x.die.id === String(selD).split('|')[0]; })[0] || od[0]) || {}).val;
  }
  function renorm(tl) { if (tl.kind === 'punch') tl.pts = P.normPunch(tl.pts).pts; else { var d = P.normDie(tl.pts); tl.pts = d.pts; if (d.V) tl.V = d.V; } }

  var app = document.getElementById('app');
  app.addEventListener('input', function (e) {
    var el = e.target, d = el.dataset;
    if (!d.prog) { userStep = false; sugg = null; sugTok++; }
    if (d.prog) { prog = +el.value / 100; var s = document.getElementById('sim'); if (s) s.innerHTML = simSvg(); return; }
    if (d.cfg) { var cv = num(el.value); cfg[d.cfg] = d.cfg === 'maxHits' ? Math.max(1, Math.round(cv)) : cv; save('pb.cfg', cfg); return; }
    if (d.vn) { var dv = byId(d.vn); if (dv) { dv.vnom = dv.vnom || {}; dv.vnom[d.k] = num(el.value); saveLib(); } return; }
    if (d.tool) { var tl = byId(d.tool); if (tl) { tl[d.tf] = d.tf === 'name' || d.tf === 'clamp' || d.tf === 'segs' ? el.value : d.tf === 'maxLoad' ? (cfg.unitK ? num(el.value) : num(el.value) * 9.81) : d.tf === 'tons' ? (cfg.unitK ? num(el.value) / 9.81 : num(el.value)) : num(el.value); saveLib(); } return; }
    if (d.f) { var v = num(el.value); if (!(v > 0)) return; part[d.f] = v; update(); return; }
    if (d.leg) { var l = num(el.value); if (!(l > 0)) return; part.out[+d.leg] = l; update(); return; }
    if (d.bg) { var g = num(el.value); if (!(g >= 1 && g <= 179)) return; (part.mode === 'manual' ? part.bends : part.groups[part.gi].bends)[+d.bg].gamma = g; update(); }
  });
  app.addEventListener('change', function (e) {
    var el = e.target, d = el.dataset; if (!d.prog) userStep = false;
    if (!d.prog && !d.gs && d.s !== 'punch' && d.s !== 'die' && d.s !== 'group') { sugg = null; sugTok++; }
    if (el.id === 'fPart') { msgs = []; readAll(el.files, function (name, text) {
      try { var x = Q.readDXF(text), roles = {}; x.pieces.forEach(function (p) { if (!(p.layer in roles)) roles[p.layer] = Q.defaultRole(p.layer); });
        var m = /(\d+(?:[.,]\d+)?)\s*mm/i.exec(name), th = m ? num(m[1]) : 0;
        part = { mode: 'dxf', name: name, t: th > 0 && th <= 30 ? th : part.t, mat: part.mat, pieces: x.pieces, roles: roles, groups: P.partFromFlat(x.pieces, roles), gi: 0 }; si = 0; prog = 1;
      } catch (err) { msgs.push(name + ': ' + t('errRead')); } }, render); return; }
    if (el.id === 'fPunch' || el.id === 'fDie') { msgs = []; var kind = el.id === 'fPunch' ? 'punch' : 'die'; readAll(el.files, function (n, x) { addTool(kind, n, x); }, function () { saveLib(); render(); }); return; }
    if (el.id === 'fLib') { msgs = []; readAll(el.files, function (n, x) { try { var a = JSON.parse(x); a = Array.isArray(a) ? a : a.tools; var okc = 0; a.forEach(function (tl) { if (tl && (tl.kind === 'machine' || tl.kind === 'material' || ((tl.kind === 'punch' || tl.kind === 'die') && Array.isArray(tl.pts) && tl.pts.length > 2))) { tl.id = tl.id && !byId(tl.id) ? String(tl.id) : tl.kind[0] + '-' + Date.now().toString(36) + Math.floor(Math.random() * 1e4); tl.name = String(tl.name || tl.id); lib.push(tl); okc++; } }); if (!okc) throw 0; } catch (err) { msgs.push(n + ': ' + t('errLib')); } }, function () { fixSel(); saveLib(); render(); }); return; }
    if (d.unit) { cfg.unitK = +el.value ? 1 : 0; save('pb.cfg', cfg); render(); return; }
    if (d.cfgb) { cfg[d.cfgb] = el.checked ? 1 : 0; save('pb.cfg', cfg); update(); return; }
    if (d.cfg) { update(); return; }
    if (d.fit) { var ft = byId(d.fit); if (ft) { ft.fits = (ft.fits || []).filter(function (x) { return x !== d.m; }); if (el.checked) ft.fits.push(d.m); saveLib(); render(); } return; }
    if (d.vu) { var du = byId(d.vu); if (du) { du.vuse = du.vuse || {}; du.vuse[d.k] = el.checked; fixSel(); saveLib(); } return; }
    if (d.s === 'machine') { selM = el.value; fixSel(); si = 0; render(); return; }
    if (d.s === 'mat') { part.mat = el.value; update(); }
    else if (d.s === 'punch') { selP = el.value; si = 0; update(); }
    else if (d.s === 'die') { selD = el.value; si = 0; update(); }
    else if (d.gs) { part.sides = part.sides || {}; part.sides[part.gi] = part.sides[part.gi] || {}; part.sides[part.gi][d.gs] = el.value; for (var q = 0; q < ev.groups[part.gi].seq.steps.length; q++) if (String(ev.groups[part.gi].seq.steps[q].k) === d.gs) si = q; userStep = true; prog = 1; update(); return; }
    else if (d.s === 'group') { part.gi = +el.value; si = 0; prog = 1; render(); }
    else if (d.bd) { (part.mode === 'manual' ? part.bends : part.groups[part.gi].bends)[+d.bd].dir = +el.value; si = 0; update(); }
    else if (d.role) { part.roles[d.role] = el.value; part.groups = P.partFromFlat(part.pieces, part.roles); part.gi = 0; si = 0; open.dLay = true; render(); }
  });
  app.addEventListener('toggle', function (e) { if (e.target.id) open[e.target.id] = e.target.open; }, true);
  app.addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return; var d = b.dataset, tl;
    if (d.lang) { lang = d.lang; save('pb.lang', lang); render(); }
    else if (d.view) { view = d.view; msgs = []; render(); }
    else if (d.step) { si = +d.step; userStep = true; var ss = ev && ev.groups[part.gi].seq.steps[si]; prog = ss && !ss.ok && ss.prog != null ? ss.prog : 1; update(); }
    else if (d.act === 'seqSet') { part.orders = part.orders || {}; var cs = ev.groups[part.gi].seq; part.orders[part.gi] = cs.steps.map(function (s) { return s.k; }); if (cs.alts && cs.alts[0]) { part.sides = part.sides || {}; part.sides[part.gi] = Object.assign({}, cs.alts[0].sides); } userStep = true; update(); }
    else if (d.act === 'seqAuto') { part.orders[part.gi] = null; if (part.sides) part.sides[part.gi] = null; userStep = false; update(); }
    else if (d.mv) { var o = part.orders[part.gi], i0 = +d.mv, i1 = i0 + (+d.by); if (o && i1 >= 0 && i1 < o.length) { var tmp = o[i0]; o[i0] = o[i1]; o[i1] = tmp; si = i1; userStep = true; prog = 1; update(); } }
    else if (d.alt) { var al = ev.groups[part.gi].seq.alts[+d.alt]; if (al) { part.orders = part.orders || {}; part.sides = part.sides || {}; part.orders[part.gi] = al.order.slice(); part.sides[part.gi] = Object.assign({}, al.sides); userStep = false; si = 0; update(); } }
    else if (d.act === 'suggest') runSuggest();
    else if (d.use && sugg) { var rw = sugg.rows[+d.use]; if (rw) { selM = rw.c.m ? rw.c.m.id : ''; selP = rw.c.pu.id; selD = rw.c.o.val; if (part.orders) part.orders = {}; userStep = false; si = 0; render(); } }
    else if (d.act === 'zoom') { fit = !fit; update(); }
    else if (d.act === 'sample') { msgs = []; samplePart(); render(); }
    else if (d.act === 'manual') { msgs = []; if (part.mode !== 'manual') part = { mode: 'manual', name: '', t: part.t, mat: part.mat, out: [30, 50], bends: [{ gamma: 90, dir: 1 }], blen: 500 }; si = 0; render(); }
    else if (d.act === 'addB') { part.out.push(30); part.bends.push({ gamma: 90, dir: 1 }); render(); }
    else if (d.act === 'delB') { part.out.pop(); part.bends.pop(); si = 0; render(); }
    else if (d.flip && (tl = byId(d.flip))) { tl.pts = tl.pts.map(function (p) { return [p[0], -p[1]]; }); renorm(tl); saveLib(); render(); }
    else if (d.mir && (tl = byId(d.mir))) { tl.pts = tl.pts.map(function (p) { return [-p[0], p[1]]; }); renorm(tl); saveLib(); render(); }
    else if (d.del) { lib = lib.filter(function (x) { return x.id !== d.del; }); lib.forEach(function (x) { if (x.fits) x.fits = x.fits.filter(function (m) { return m !== d.del; }); }); fixSel(); saveLib(); render(); }
    else if (d.act === 'addMat') { lib.push({ id: 'mat-' + Date.now().toString(36), name: t('newMat'), kind: 'material', Rm: 420, rv: 0.16, K: 0.4, rmin: 0 }); saveLib(); render(); }
    else if (d.act === 'addM') { lib.push({ id: 'm-' + Date.now().toString(36), name: t('newM'), kind: 'machine', tons: 100, length: 3000, open: 0, clamp: '' }); saveLib(); render(); }
    else if (d.act === 'exp') saveFile('tool-library.json', JSON.stringify({ tools: lib }, null, 1), 'application/json');
    else if (d.act === 'demo') { if (EMB) lib = builtIn(); else P.demoLib().forEach(function (x) { if (!byId(x.id)) lib.push(x); }); ensureMats(); fixSel(); saveLib(); render(); }
  });

  var EMB = window.PB_LIBRARY && Array.isArray(window.PB_LIBRARY.tools) && window.PB_LIBRARY.tools.length ? window.PB_LIBRARY : null, LIBV = EMB ? String(EMB.v) : 'demo';
  function builtIn() { return EMB ? JSON.parse(JSON.stringify(EMB.tools)) : P.demoLib(); }
  function ensureMats() { if (!lib.some(function (x) { return x.kind === 'material'; })) lib = lib.concat(JSON.parse(JSON.stringify(DEF_MATS))); }
  var st = load('pb.lib'), sv = load('pb.libv'); lib = Array.isArray(st) && st.length && (sv == null || sv === LIBV) && !(EMB && sv == null) ? st : builtIn();
  ensureMats();
  var sc = load('pb.cfg'); if (sc) Object.keys(cfg).forEach(function (k) { if (typeof sc[k] === 'number') cfg[k] = sc[k]; });
  var nl = (navigator.language || 'en').slice(0, 2); lang = load('pb.lang'); if (LANGS.indexOf(lang) < 0) lang = LANGS.indexOf(nl) >= 0 ? nl : 'en';
  selP = 'p-straight'; selD = 'd-v12'; selM = byId('m-100') ? 'm-100' : (tools('machine')[0] || {}).id || ''; fixSel(); samplePart(); render();
})();
